<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>送信完了 | 長善寺</title>
  <meta name="description" content="長善寺へのお問い合わせを受け付けました。" />

  <style>
    :root {
      --main: #2f4f3f;
      --main-dark: #243b30;
      --sub: #8a6f45;
      --bg: #f7f4ee;
      --white: #ffffff;
      --text: #2b2b2b;
      --muted: #666666;
      --line: rgba(0, 0, 0, 0.08);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: "Hiragino Mincho ProN", "Yu Mincho", "YuMincho", serif;
      color: var(--text);
      background: var(--bg);
      line-height: 1.8;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    header {
      background: rgba(255, 255, 255, 0.96);
      border-bottom: 1px solid var(--line);
    }

    .header-inner {
      max-width: 1100px;
      margin: 0 auto;
      padding: 14px 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
    }

    .site-title {
      font-size: 22px;
      font-weight: bold;
      letter-spacing: 0.12em;
      color: var(--main);
      white-space: nowrap;
    }

    .site-nav {
      display: flex;
      align-items: center;
      gap: 18px;
      font-size: 14px;
      font-family: sans-serif;
      flex-wrap: wrap;
      justify-content: flex-end;
    }

    .site-nav a {
      color: var(--text);
      padding-bottom: 3px;
      border-bottom: 1px solid transparent;
    }

    .site-nav a:hover,
    .site-nav a.current {
      color: var(--sub);
      border-bottom: 1px solid var(--sub);
    }

    .site-nav .language-link {
      padding: 5px 12px;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: var(--white);
      color: var(--main);
    }

    main {
      min-height: calc(100vh - 170px);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 72px 24px;
    }

    .card {
      max-width: 760px;
      width: 100%;
      background: var(--white);
      padding: 42px 34px;
      border-radius: 16px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.06);
      text-align: center;
    }

    .label {
      color: var(--sub);
      font-size: 13px;
      letter-spacing: 0.18em;
      font-family: sans-serif;
      margin-bottom: 8px;
    }

    h1 {
      margin: 0 0 18px;
      color: var(--main);
      font-size: clamp(28px, 4vw, 42px);
      font-weight: normal;
      letter-spacing: 0.1em;
    }

    p {
      margin: 0 auto 18px;
      color: var(--muted);
      max-width: 620px;
    }

    .button-wrap {
      display: flex;
      justify-content: center;
      gap: 14px;
      flex-wrap: wrap;
      margin-top: 28px;
    }

    .button {
      display: inline-block;
      padding: 11px 24px;
      border-radius: 999px;
      background: var(--main);
      color: var(--white);
      font-weight: bold;
      font-family: sans-serif;
    }

    .button.secondary {
      background: transparent;
      color: var(--main);
      border: 1px solid var(--main);
    }

    footer {
      background: var(--main-dark);
      color: var(--white);
      text-align: center;
      padding: 28px 24px;
      font-size: 14px;
    }

    footer p {
      color: var(--white);
      margin: 4px 0;
    }

    @media (max-width: 820px) {
      .header-inner {
        display: block;
        text-align: center;
        padding: 12px 18px;
      }

      .site-title {
        font-size: 20px;
      }

      .site-nav {
        margin-top: 10px;
        justify-content: center;
        gap: 10px 12px;
        font-size: 13px;
      }

      main {
        padding: 56px 20px;
      }

      .card {
        padding: 34px 24px;
      }
    }
  </style>
</head>

<body>
  <header>
    <div class="header-inner">
      <a class="site-title" href="index.html">長善寺</a>

      <nav class="site-nav">
        <a href="index.html#about">長善寺について</a>
        <a href="zazen.html">座禅体験</a>
        <a href="kuyo.html">法事・供養</a>
        <a href="grave.html">永代供養墓</a>
        <a href="access.html">アクセス</a>
        <a href="contact.html" class="current">お問い合わせ</a>
        <a class="language-link" href="contact-en.html">English</a>
      </nav>
    </div>
  </header>

  <main>
    <div class="card">
      <div class="label">SENT</div>
      <h1>送信が完了しました</h1>
      <p>
        お問い合わせありがとうございます。内容を確認のうえ、必要に応じて返信いたします。
      </p>
      <p>
        数日たっても返信がない場合は、メールアドレスの入力間違いや迷惑メールフォルダをご確認ください。
      </p>

      <div class="button-wrap">
        <a class="button" href="index.html">トップページへ戻る</a>
        <a class="button secondary" href="contact.html">お問い合わせページへ戻る</a>
      </div>
    </div>
  </main>

  <footer>
    <p>長善寺</p>
    <p>〒520-1803 滋賀県高島市マキノ町小荒路581</p>
    <p>&copy; Chozenji. All Rights Reserved.</p>
  </footer>
</body>
</html>
